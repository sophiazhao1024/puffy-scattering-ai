[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "puffy-scattering-ai"
version = "0.2.0"
readme = "README.md"
license = {file = "LICENSE"}
description = "Independent finite-size Yukawa scattering reference with an audited ML benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2"]
[project.scripts]
puffy-scattering = "puffy.__main__:main"
[project.optional-dependencies]
test = ["pytest>=8,<10"]
notebook = ["jupyter>=1,<2", "nbclient>=0.10,<1", "nbformat>=5,<6", "ipykernel>=6,<8"]
plot = ["matplotlib>=3.8,<4"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["puffy*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
