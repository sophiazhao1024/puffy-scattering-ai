name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test,notebook]' build
      - run: python -m pytest -q
      - run: python examples/quickstart.py
      - run: python examples/train_from_csv.py
      - run: python -m jupyter nbconvert --to notebook --execute notebooks/01_quickstart.ipynb --output /tmp/executed.ipynb
      - run: python -m build
